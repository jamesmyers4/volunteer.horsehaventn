name: Nightly Backup

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
        # awscli is not installed here: Ubuntu dropped the `awscli` apt package on the
        # noble (24.04) runner image ("Package 'awscli' has no installation candidate"),
        # but GitHub-hosted ubuntu-latest runners ship AWS CLI v2 preinstalled already,
        # so the `aws s3 cp` step below works with no extra install step at all.
        #
        # Ubuntu noble's default postgresql-client is 16.14, but Neon runs Postgres 18 -
        # pg_dump refuses to dump from a server newer than itself ("aborting because of
        # server version mismatch"). The official PGDG apt repo (added via Postgres's own
        # setup script, not a hand-rolled apt-key add) provides postgresql-client-18 to
        # match, but the runner image's pre-installed postgresql-client-16 still wins on
        # PATH by default via Debian's pg_wrapper - prepending 18's bin dir to $GITHUB_PATH
        # (persists for every later step in this job) makes pg_dump/psql actually resolve
        # to 18 instead. Re-check this if Neon's Postgres version ever moves again.

      - name: Neon keep-alive ping
        run: psql "${{ secrets.DATABASE_URL }}" -c "SELECT 1;"

      - name: Dump database
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          pg_dump "${{ secrets.DIRECT_URL }}" --format=custom --file="backup-$TIMESTAMP.dump"
          gzip "backup-$TIMESTAMP.dump"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "backup-$TIMESTAMP.dump.gz" \
            "s3://${{ secrets.R2_BUCKET_NAME }}/db-backups/backup-$TIMESTAMP.dump.gz" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
